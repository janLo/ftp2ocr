name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Install uv
        # setup-uv publishes exact-version tags only (no floating v9 tag).
        uses: astral-sh/setup-uv@v9.0.0

      - name: Install OCR toolchain (for integration tests)
        # Note: jbig2enc is intentionally absent — Ubuntu does not package it
        # (Debian only; the Docker image gets it from Debian trixie). ocrmypdf
        # probes for `jbig2` at runtime and simply skips JBIG2 recompression
        # when it is unavailable, so tests still exercise the full OCR path.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ghostscript pngquant tesseract-ocr tesseract-ocr-deu unpaper

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff (lint)
        run: uv run ruff check src tests

      - name: Ruff (format check)
        run: uv run ruff format --check src tests

      - name: Pytest (unit + integration)
        run: uv run pytest -q -m ""

  docker:
    name: Build & push image
    runs-on: ubuntu-latest
    needs: test
    # Only push images for commits/tags on the main branch, not for PRs.
    if: github.event_name != 'pull_request'
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: janlo/pdf2ocr
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
